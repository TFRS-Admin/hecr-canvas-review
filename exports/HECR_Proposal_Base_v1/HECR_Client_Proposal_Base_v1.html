<!doctype html>
<!--
  Design: Proposal Ledger / customer-facing system map.
  This file is deliberately self-contained: no Manus URLs, package installs, images, or build tools are required.
  SAFE EDIT ZONES: the PROPOSAL_CONTENT object below. Do not modify the protected renderer or visual token sections
  unless the proposal design itself is intentionally being versioned.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Client proposal system map" />
    <title>Client Proposal Base</title>
    <style>
      /* PROTECTED VISUAL TOKENS — Proposal Ledger v1.0 */
      :root {
        --ink: #061a35;
        --ink-2: #0d2b52;
        --paper: #f7f4ed;
        --paper-2: #ece8df;
        --line: #c9d2dc;
        --soft-line: #dce4e9;
        --blue: #1e6dc2;
        --teal: #128b84;
        --green: #397f48;
        --orange: #d86e19;
        --violet: #6d43a7;
        --red: #a93935;
        --gold: #d3a21d;
        --display: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        --body: "Trebuchet MS", "Aptos", "Segoe UI", sans-serif;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }
      * { box-sizing: border-box; }
      html { background: var(--paper-2); scroll-behavior: smooth; }
      body { margin: 0; color: var(--ink); background: var(--paper); font-family: var(--body); }
      button { font: inherit; }
      .proposal { min-height: 100vh; overflow: hidden; }
      .topbar { padding: 12px 4vw; background: var(--ink); color: #fff; border-bottom: 4px solid var(--gold); display: flex; align-items: center; justify-content: space-between; gap: 24px; }
      .brand { display: flex; align-items: center; gap: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; font-size: 12px; }
      .mark { width: 28px; height: 28px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; transform: rotate(45deg); }
      .mark i { border-radius: 2px; background: #fff; }
      .mark i:nth-child(2), .mark i:nth-child(4), .mark i:nth-child(6), .mark i:nth-child(8) { background: var(--gold); }
      .mark i:nth-child(5) { background: var(--blue); }
      .utility { display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
      .version { border: 1px solid rgba(255,255,255,.35); padding: 7px 10px; border-radius: 999px; }
      .print-button { background: var(--gold); border: 0; color: var(--ink); padding: 8px 11px; border-radius: 4px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
      .hero { position: relative; padding: clamp(46px, 7vw, 94px) 4vw clamp(38px, 6vw, 76px); color: #fff; background: radial-gradient(circle at 84% 28%, rgba(30,109,194,.35), transparent 24%), linear-gradient(122deg, var(--ink) 0%, #0a2547 62%, #071d39 100%); }
      .hero:before { content: ""; position: absolute; inset: 0; opacity: .3; background-image: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px); background-size: 44px 44px; mask-image: linear-gradient(to bottom, #000, transparent); }
      .hero-content { position: relative; max-width: 1140px; margin: 0 auto; }
      .eyebrow { display: flex; align-items: center; gap: 9px; margin: 0 0 18px; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .16em; color: #b6c9e0; }
      .eyebrow:before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 15px 0 0 var(--blue), 30px 0 0 var(--violet); }
      h1 { max-width: 800px; margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(44px, 7.2vw, 104px); line-height: .88; letter-spacing: .015em; text-transform: uppercase; }
      h1 em { color: #dce7ff; font-style: italic; }
      .hero-summary { max-width: 630px; margin: 24px 0 0; color: #d6e0ec; font-size: clamp(17px, 2vw, 22px); line-height: 1.5; }
      .confidence-strip { position: relative; z-index: 1; max-width: 1140px; margin: 0 auto; padding: 0 0; display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); border-radius: 7px; overflow: hidden; }
      .confidence-strip div { padding: 14px 17px; border-right: 1px solid rgba(255,255,255,.2); font-size: 12px; color: #eaf2fb; }
      .confidence-strip div:last-child { border: 0; }
      .confidence-strip b { display: block; margin-bottom: 3px; color: var(--gold); font-family: var(--mono); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; }
      .section { max-width: 1220px; margin: 0 auto; padding: clamp(54px, 7vw, 88px) 4vw; }
      .section-head { display: grid; grid-template-columns: 88px 1fr minmax(260px, .7fr); gap: 28px; align-items: start; margin-bottom: 32px; }
      .section-number { font-family: var(--display); font-size: 62px; line-height: .8; color: var(--blue); }
      .section-title { margin: 0; font-family: var(--display); font-size: clamp(34px, 4.5vw, 58px); line-height: .9; letter-spacing: .01em; text-transform: uppercase; }
      .section-title em { color: var(--blue); font-style: italic; }
      .section-copy { margin: 3px 0 0; color: #476078; line-height: 1.55; font-size: 15px; }
      .stage-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
      .stage { min-height: 255px; border: 1px solid var(--line); border-top: 5px solid var(--tone); background: #fff; padding: 18px; display: flex; flex-direction: column; box-shadow: 0 11px 25px rgba(4, 30, 61, .05); }
      .stage-kicker { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; color: var(--tone); font-family: var(--mono); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
      .stage-index { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 50%; background: var(--tone); color: #fff; }
      .stage h3 { margin: 0 0 9px; font-family: var(--display); font-size: 24px; line-height: .95; text-transform: uppercase; }
      .stage p { margin: 0; color: #466078; font-size: 13px; line-height: 1.45; }
      .route-wrap { border: 1px solid #b7c4d1; background: #fff; padding: 28px; box-shadow: 0 14px 34px rgba(4, 30, 61, .07); }
      .route-head { display: flex; justify-content: space-between; gap: 20px; padding-bottom: 17px; border-bottom: 1px solid var(--soft-line); margin-bottom: 25px; font-family: var(--mono); color: #55708a; font-size: 10px; text-transform: uppercase; letter-spacing: .12em; }
      .route { display: grid; grid-template-columns: repeat(7, minmax(90px, 1fr)); align-items: stretch; gap: 0; }
      .node { position: relative; padding: 16px 14px; background: var(--ink); color: #fff; min-height: 119px; border-right: 1px solid rgba(255,255,255,.2); }
      .node:after { content: ""; position: absolute; top: 50%; right: -9px; z-index: 2; width: 16px; height: 16px; border: solid #fff; border-width: 2px 2px 0 0; transform: translateY(-50%) rotate(45deg); background: var(--ink); }
      .node:last-child:after { display: none; }
      .node span { display: block; margin-bottom: 22px; font-family: var(--mono); color: var(--node); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
      .node strong { display: block; font-family: var(--display); font-size: 21px; line-height: .95; text-transform: uppercase; }
      .roles { display: grid; grid-template-columns: 1.45fr .95fr; gap: 20px; margin-top: 20px; }
      .role-board, .proof-board { border: 1px solid var(--line); background: #fff; padding: 24px; }
      .board-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 15px; border-bottom: 1px solid var(--soft-line); margin-bottom: 18px; }
      .board-head h3 { margin: 0; font-family: var(--display); font-size: 29px; text-transform: uppercase; }
      .board-head span { color: #698099; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
      .role-row { display: grid; grid-template-columns: 130px 1fr; gap: 18px; padding: 14px 0; border-bottom: 1px solid var(--soft-line); }
      .role-row:last-child { border: 0; }
      .role-row b { color: var(--role); font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
      .role-row p { margin: 0; font-size: 14px; color: #476078; line-height: 1.4; }
      .proof-list { list-style: none; padding: 0; margin: 0; }
      .proof-list li { position: relative; padding: 11px 0 11px 26px; border-bottom: 1px solid var(--soft-line); color: #28445e; font-size: 14px; line-height: 1.35; }
      .proof-list li:before { content: "✓"; position: absolute; left: 0; top: 9px; color: var(--green); font-weight: 900; font-size: 17px; }
      .proof-list li:last-child { border: 0; }
      .promise { background: var(--ink); color: #fff; }
      .promise .section-title { color: #fff; }
      .promise .section-copy { color: #c3d1df; }
      .value-grid { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid rgba(255,255,255,.25); }
      .value { padding: 26px 22px; min-height: 150px; border-right: 1px solid rgba(255,255,255,.25); }
      .value:last-child { border-right: 0; }
      .value span { display: block; margin-bottom: 22px; color: var(--gold); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; }
      .value h3 { margin: 0 0 10px; font-family: var(--display); font-size: 25px; line-height: .95; text-transform: uppercase; }
      .value p { margin: 0; color: #c6d4e2; font-size: 13px; line-height: 1.45; }
      .footer { padding: 26px 4vw; background: #051425; color: #c4d1df; display: flex; justify-content: space-between; gap: 24px; font-size: 11px; line-height: 1.5; }
      .footer b { color: #fff; text-transform: uppercase; letter-spacing: .08em; }
      @media (max-width: 1000px) { .stage-grid { grid-template-columns: repeat(3, 1fr); } .route { grid-template-columns: repeat(4, 1fr); gap: 8px; } .node { border: 0; } .node:after { display: none; } .section-head { grid-template-columns: 56px 1fr; } .section-copy { grid-column: 2; } }
      @media (max-width: 680px) { .topbar { align-items: flex-start; } .utility .version { display: none; } .confidence-strip, .stage-grid, .roles, .value-grid { grid-template-columns: 1fr; } .confidence-strip div, .value { border-right: 0; border-bottom: 1px solid rgba(255,255,255,.25); } .confidence-strip div:last-child, .value:last-child { border-bottom: 0; } .section-head { grid-template-columns: 1fr; gap: 12px; } .section-copy { grid-column: auto; } .section-number { font-size: 44px; } .route { grid-template-columns: 1fr; } .role-row { grid-template-columns: 1fr; gap: 6px; } .footer { display: block; } .footer p + p { margin-top: 12px; } }
      @media print { @page { size: landscape; margin: .25in; } body { background: white; } .print-button { display: none; } .proposal { min-width: 1100px; } .topbar, .hero, .promise { -webkit-print-color-adjust: exact; print-color-adjust: exact; } .section { padding: 28px 32px; } }
    </style>
  </head>
  <body>
    <main id="proposal" class="proposal"></main>
    <script>
      /*
        SAFE EDIT ZONE — Change proposal copy here only.
        Keep each stage to a short title and one short description for layout stability.
        This object can be copied to JSON for another AI/tool, reviewed, then pasted back here.
      */
      const PROPOSAL_CONTENT = {
        identity: { brand: "{{YOUR BRAND}}", label: "Client Proposal", version: "Proposal Base · v1.0", date: "{{MONTH YYYY}}" },
        hero: {
          eyebrow: "Connected Customer Journey · Proposal",
          title: "One system.<br><em>Clearer customer outcomes.</em>",
          summary: "A connected customer journey designed to capture demand, support meaningful decisions, deliver a consistent experience, and make performance visible."
        },
        confidence: [
          ["01 · Direction", "One shared customer journey"],
          ["02 · Control", "Clear roles and handoffs"],
          ["03 · Experience", "Useful communication at each stage"],
          ["04 · Proof", "Evidence before performance claims"]
        ],
        overview: { kicker: "The System", title: "From first signal<br>to <em>lasting value.</em>", copy: "This proposal organizes the customer experience into six connected stages. Each stage has a purpose, a customer outcome, and a named way to know it is working." },
        stages: [
          ["01", "Foundation", "The control layer", "Roles, rules, and a clean source of truth.", "#1e6dc2"],
          ["02", "Capture & Route", "The right entry", "Recognize the source and guide each person to the appropriate path.", "#128b84"],
          ["03", "Engage & Book", "The helpful response", "Provide timely, useful follow-up and make the next step clear.", "#6d43a7"],
          ["04", "Enroll & Onboard", "A confident start", "Confirm the real decision, set expectations, and create a supported beginning.", "#d86e19"],
          ["05", "Deliver & Retain", "The client experience", "Coordinate service, support progress, and protect the relationship.", "#397f48"],
          ["06", "Prove & Improve", "The learning loop", "Review evidence, resolve exceptions, and improve the system deliberately.", "#1e6dc2"]
        ],
        journey: [
          ["Source", "Known entry", "#1e6dc2"], ["Fit", "Helpful engagement", "#6d43a7"], ["Decision", "Human accountability", "#d86e19"], ["Start", "Verified enrollment", "#128b84"], ["Service", "Consistent delivery", "#397f48"], ["Support", "Clear exception path", "#d86e19"], ["Review", "Evidence and improvement", "#1e6dc2"]
        ],
        roles: [
          ["Systems", "Keep records, timing, and approved consequences consistent.", "#1e6dc2"],
          ["Conversation", "Help people navigate approved information, questions, and next steps.", "#6d43a7"],
          ["People", "Own judgment, commercial decisions, sensitive situations, and exceptions.", "#d86e19"],
          ["Evidence", "Shows what happened so the team can improve the real customer experience.", "#397f48"]
        ],
        proof: ["One customer record and a clear source of entry", "Clear consent and communication boundaries", "Named human ownership for decisions and exceptions", "Verified enrollment before access or onboarding", "A visible service and support path", "Regular evidence review before public performance claims"],
        value: { kicker: "What This Creates", title: "A proposal grounded in<br><em>how the business really works.</em>", copy: "This is not a promise of outcomes. It is a practical plan for a more consistent, controlled, and measurable customer experience.", cards: [
          ["Clarity", "One connected journey instead of scattered tactics."], ["Confidence", "Customers know the next useful step and who can help."], ["Control", "The right people own the decisions that require judgment."], ["Proof", "The team can see what happened and improve from evidence."]
        ] },
        footer: { left: "Proposal Base · Visual System v1.0", right: "Content changes require client-scope and decision-record review." }
      };

      const e = (value) => String(value).replace(/[&<>\"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" })[character]);
      const render = () => {
        document.title = `${PROPOSAL_CONTENT.identity.brand} — ${PROPOSAL_CONTENT.identity.label}`;
        const stages = PROPOSAL_CONTENT.stages.map(([num, title, kicker, desc, tone]) => `<article class="stage" style="--tone:${tone}"><div class="stage-kicker"><span class="stage-index">${e(num)}</span><span>${e(kicker)}</span></div><h3>${e(title)}</h3><p>${e(desc)}</p></article>`).join("");
        const journey = PROPOSAL_CONTENT.journey.map(([label, sub, tone]) => `<article class="node" style="--node:${tone}"><span>${e(sub)}</span><strong>${e(label)}</strong></article>`).join("");
        const roles = PROPOSAL_CONTENT.roles.map(([title, desc, tone]) => `<div class="role-row" style="--role:${tone}"><b>${e(title)}</b><p>${e(desc)}</p></div>`).join("");
        const proof = PROPOSAL_CONTENT.proof.map((item) => `<li>${e(item)}</li>`).join("");
        const values = PROPOSAL_CONTENT.value.cards.map(([title, desc], index) => `<article class="value"><span>0${index + 1}</span><h3>${e(title)}</h3><p>${e(desc)}</p></article>`).join("");
        const confidence = PROPOSAL_CONTENT.confidence.map(([label, desc]) => `<div><b>${e(label)}</b>${e(desc)}</div>`).join("");
        document.getElementById("proposal").innerHTML = `
          <header class="topbar"><div class="brand"><span class="mark">${"<i></i>".repeat(9)}</span><span>${e(PROPOSAL_CONTENT.identity.brand)} · ${e(PROPOSAL_CONTENT.identity.label)}</span></div><div class="utility"><span class="version">${e(PROPOSAL_CONTENT.identity.version)}</span><button class="print-button" onclick="window.print()">Print / Save PDF</button></div></header>
          <section class="hero"><div class="hero-content"><p class="eyebrow">${e(PROPOSAL_CONTENT.hero.eyebrow)}</p><h1>${PROPOSAL_CONTENT.hero.title}</h1><p class="hero-summary">${e(PROPOSAL_CONTENT.hero.summary)}</p></div></section>
          <section style="background:var(--ink); padding:0 4vw 32px"><div class="confidence-strip">${confidence}</div></section>
          <section class="section"><div class="section-head"><div class="section-number">01</div><div><p class="eyebrow" style="color:#55708a">${e(PROPOSAL_CONTENT.overview.kicker)}</p><h2 class="section-title">${PROPOSAL_CONTENT.overview.title}</h2></div><p class="section-copy">${e(PROPOSAL_CONTENT.overview.copy)}</p></div><div class="stage-grid">${stages}</div></section>
          <section class="section" style="padding-top:10px"><div class="section-head"><div class="section-number">02</div><div><p class="eyebrow" style="color:#55708a">Operating Journey</p><h2 class="section-title">One connected<br><em>customer route.</em></h2></div><p class="section-copy">The route shows the shared sequence. It intentionally separates customer engagement, human judgment, and verified outcomes.</p></div><div class="route-wrap"><div class="route-head"><span>Customer Journey</span><span>Source → Service → Evidence</span></div><div class="route">${journey}</div></div><div class="roles"><article class="role-board"><div class="board-head"><h3>The Right Role<br>For Each Part</h3><span>Authority boundaries</span></div>${roles}</article><aside class="proof-board"><div class="board-head"><h3>Built-In<br>Proof Points</h3><span>Review before claims</span></div><ul class="proof-list">${proof}</ul></aside></div></section>
          <section class="section promise"><div class="section-head"><div class="section-number" style="color:var(--gold)">03</div><div><p class="eyebrow">${e(PROPOSAL_CONTENT.value.kicker)}</p><h2 class="section-title">${PROPOSAL_CONTENT.value.title}</h2></div><p class="section-copy">${e(PROPOSAL_CONTENT.value.copy)}</p></div><div class="value-grid">${values}</div></section>
          <footer class="footer"><p><b>${e(PROPOSAL_CONTENT.identity.brand)}</b><br>${e(PROPOSAL_CONTENT.identity.date)}</p><p>${e(PROPOSAL_CONTENT.footer.left)}<br>${e(PROPOSAL_CONTENT.footer.right)}</p></footer>`;
      };
      render();
    </script>
  </body>
</html>
